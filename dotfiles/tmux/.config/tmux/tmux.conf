# Prefix is C-Space.  Press  prefix ?  for the cheatsheet popup.
# Full key list:  prefix :  then  list-keys

# -- Prefix --
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -- General --
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -sg escape-time 0
set -g set-clipboard on
# Let programs inside tmux emit their own OSC/DCS sequences (image protocols,
# desktop notifications, progress bars) instead of tmux swallowing them.
set -g allow-passthrough on
# Messages and pane numbers stick around long enough to actually read/act on.
set -g display-time 2000
set -g display-panes-time 2000
# Killing the last window of a session detaches the client (tmux's default)
# rather than hopping you into some other session.
set -g detach-on-destroy on
# Grace period for the -r (repeatable) bindings: resize/move without re-pressing
# the prefix each time.
set -g repeat-time 600
# Double-click selects whole paths and identifiers (default breaks on -_@).
set -g word-separators " "

# -- Terminal & Colors --
# Inner TERM for programs running inside tmux.
set -g default-terminal "tmux-256color"
# Advertise ghostty's capabilities so tmux forwards them through: truecolor
# (RGB), extended + colored underlines (usstyle = Smulx + Setulc),
# strikethrough, overline, OSC 8 hyperlinks, synchronized output, cursor
# color/style, OSC 52 clipboard, window title, focus reporting.
# extkeys intentionally omitted: ghostty's CSI-u sequences leak through to
# inner shells over ssh and print as text on ctrl-p/n/r.
set -as terminal-features ",xterm-ghostty*:RGB:usstyle:strikethrough:overline:hyperlinks:sync:ccolour:cstyle:clipboard:title:focus"
set -s extended-keys off
# Legacy path (Termius → SSH where outer TERM is xterm-256color).
set -as terminal-features ",xterm-256color:RGB"
# Panes only inherit COLORTERM if an RGB-capable client was attached when the
# pane was created; pin it server-wide so truecolor apps never fall back to
# 256 colors. tmux downconverts for any non-RGB client, so this is safe.
set-environment -g COLORTERM truecolor

# -- Copy mode (vi) --
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
# One key into scrollback search.
bind / copy-mode \; send-keys ?

# -- Pane splitting --
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# -- Seamless nvim <-> tmux pane navigation (smart-splits.nvim) --
# nvim sets @pane-is-vim on VimEnter/VimLeave; tmux reads the flag.
bind -n C-h if -F '#{@pane-is-vim}' 'send-keys C-h' 'select-pane -L'
bind -n C-j if -F '#{@pane-is-vim}' 'send-keys C-j' 'select-pane -D'
bind -n C-k if -F '#{@pane-is-vim}' 'send-keys C-k' 'select-pane -U'
bind -n C-l if -F '#{@pane-is-vim}' 'send-keys C-l' {
  if -F '#{pane_at_right}' 'send-keys C-l' 'select-pane -R'
}
bind C-l send-keys 'C-l'

# -- Pane resize (hold the key to keep resizing) --
# Shadows the default prefix L (last-session); use prefix ( / ) for sessions.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# -- Pane rearranging --
# prefix ! already breaks a pane out into its own window; this pulls one back.
bind @ choose-window "join-pane -h -s '%%'"

# -- Windows --
bind c new-window -c "#{pane_current_path}"
bind Tab last-window
# Jump straight to a window without the prefix.
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-h previous-window
bind -n M-l next-window
# Reorder windows in place.
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1
# Zoomed pickers: full-screen instead of a cramped strip.
bind w choose-tree -Zw
bind s choose-tree -Zs

# -- Sessions --
bind C-n command-prompt -p "new session:" "new-session -s '%%' -c '#{pane_current_path}'"

# -- Popups --
# Throwaway shell in the current directory; closes when you exit.
bind g display-popup -E -d "#{pane_current_path}" -w 80% -h 80%
bind ? display-popup -E -w 84 -h 36 "less -R ~/.config/tmux/cheatsheet.txt"
# jj log for whatever repo the pane is in; q closes. 2>&1 so "not a repo"
# stays on screen instead of the popup flashing shut.
bind G display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "jj log --color=always 2>&1 | less -R"

# -- Reload config --
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# -- Plugins --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-osc52 1
set -g @thumbs-regexp-1 '\S+\.\w+:\d+'                               # file:line (src/main.rs:42)
set -g @thumbs-regexp-2 '`[^`]+`'                                    # backtick-wrapped text
set -g @thumbs-regexp-3 '\b[a-f0-9]{7,12}\b'                         # short commit/change IDs
set -g @thumbs-regexp-4 '~/[\w./@-]+'                                # ~/home paths
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'
# Window list is the main navigation aid, so label each window with its *name*
# -- which follows the running command, or whatever you set with prefix , --
# instead of catppuccin's default of the long user@host:path pane title.
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# -- Initialize TPM (keep at bottom) --
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'
run '~/.local/share/tmux/plugins/tpm/tpm'

# -- Status bar (after TPM so catppuccin modules are loaded) --
# Empty while local. Attached over SSH, a red hostname badge on the left makes
# it obvious which box the panes are actually running on. Commas inside the
# #[...] style are escaped as #, so they don't terminate the conditional.
# status-left-length defaults to 10, which truncates the hostname badge.
set -g status-left-length 40
set -g status-left "#{?SSH_CONNECTION,#[fg=#{E:@thm_crust}#,bg=#{E:@thm_red}#,bold] #{host_short} #[default] ,}"
set -gF status-right "#{E:@catppuccin_status_session}"

# -- Mouse copy (after TPM: tmux-yank binds this too, and loads at `run tpm`) --
# Same pbcopy behaviour as tmux-yank's, minus the cancel -- dragging to copy
# leaves the selection and scroll position alone instead of snapping you back
# down to the prompt.
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear pbcopy

# -- Pane borders (after TPM so it wins over the theme's defaults) --
# Heavy lines make the active pane obvious at a glance in a 3+ pane layout.
set -g pane-border-lines heavy
set -g pane-border-indicators both
