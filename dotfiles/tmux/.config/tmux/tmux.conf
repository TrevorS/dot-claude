# -- Prefix --
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# -- General --
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g focus-events on
set -sg escape-time 0
set -g set-clipboard on

# -- Terminal & Colors --
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# -- Copy mode (vi) --
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# -- Pane splitting --
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# -- New windows keep path --
bind c new-window -c "#{pane_current_path}"

# -- Reload config --
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# -- Plugins --
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-osc52 1
set -g @thumbs-regexp-1 '\S+\.\w+:\d+'                               # file:line (src/main.rs:42)
set -g @thumbs-regexp-2 '`[^`]+`'                                    # backtick-wrapped text
set -g @thumbs-regexp-3 '\b[a-f0-9]{7,12}\b'                         # short commit/change IDs
set -g @thumbs-regexp-4 '~/[\w./@-]+'                                # ~/home paths
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavor 'mocha'

# -- Initialize TPM (keep at bottom) --
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'
run '~/.local/share/tmux/plugins/tpm/tpm'

# -- Status bar (after TPM so catppuccin modules are loaded) --
set -g status-left ""
set -gF status-right "#{E:@catppuccin_status_session}"
