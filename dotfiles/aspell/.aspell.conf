# Read automatically as ~/.aspell.conf. Claude Code's `spellcheck` setting runs
# aspell in ispell -a pipe mode with no flags, so this file and the personal
# dictionary are the only way to influence it. It asks only "is this
# misspelled" and discards suggestions, so coverage matters and suggestion
# quality does not.
lang en_US

# Three ways this silently does nothing, all hit during setup:
#   1. This key must be set explicitly, even though it is identical to the
#      default `aspell config personal` reports. Unset, the file never loads.
#   2. Keep it RELATIVE (resolved against home-dir). aspell expands neither ~
#      nor $HOME; both parse fine, then fail to load.
#   3. The .pws header lang must read `en`, not `en_US`.
# Check: cd /tmp && echo "jj mmap teh" | aspell -a | grep '^&'   -> teh only.
personal .aspell.en_US.pws

# Backstop for URLs and paths; Claude Code already strips most before asking.
mode url

# run-together is deliberately off: it accepts anything that splits into two
# words, swallowing dropped-space typos ("thebug"), and it masks a broken
# personal dictionary ("revset" passes as "rev" + "set" either way).
