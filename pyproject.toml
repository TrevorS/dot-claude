[project]
name = "dot-claude"
version = "0.1.0"
description = "Claude Code configuration — skills, commands, agents, hooks, rules, and dotfiles"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk==0.2.137; sys_platform == 'darwin'",
    "pre-commit==4.6.2",
]

[tool.uv]
package = false
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = [
    "basedpyright>=1.29.0",
    "ruff==0.16.3",
    "ty==0.0.71",
]

[tool.ruff.lint]
# Ruff's own default (E4/E7/E9 + F) plus I for import sorting. E501 (line length)
# is deliberately excluded: 91 of the repo's 96 E-findings were E501 against the
# 88-col default, and line length belongs to a formatter, not the linter.
# rules/python.md mandates ruff; this is what `make validate` enforces.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ty]
# Scripts use inline uv script metadata for their deps (not installed in project venv)
[tool.ty.rules]
unresolved-import = "ignore"
