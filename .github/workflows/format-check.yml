name: Format and Lint Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  format-and-lint-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.18"

      - name: Install Python dependencies
        run: uv sync

      # Only the hook tests need a tool the runner lacks: their jj cases skip
      # without jj. shellcheck and jq ship on the runner image. The prebuilt
      # musl binary replaces `make install`, which compiled cargo-binstall from
      # source on every run.
      - name: Install jj
        env:
          GH_TOKEN: ${{ github.token }}
          JJ_VERSION: v0.45.1
        run: |
          tarball="jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          gh release download "$JJ_VERSION" --repo jj-vcs/jj --pattern "$tarball" --dir "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/jj"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/jj" ./jj
          echo "$RUNNER_TEMP/jj" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/jj/jj" --version

      - name: Run pre-commit checks
        run: make validate
        env:
          # Both run in the Lua jobs below instead.
          SKIP: luacheck,stylua

  nvim-lint:
    name: Lint nvim config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"

      - uses: leafo/gh-actions-luarocks@v6

      - name: Install luacheck
        run: luarocks install luacheck

      - name: Run luacheck
        run: >-
          luacheck --config dotfiles/nvim/.config/nvim/.luacheckrc
          dotfiles/nvim/.config/nvim/init.lua scripts/update-nvim-plugins.lua

  nvim-format:
    name: Check nvim formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check dotfiles/nvim/.config/nvim/init.lua scripts/update-nvim-plugins.lua
