# ABOUTME: GitHub Actions workflow for checking code formatting and linting
# ABOUTME: Runs pre-commit hooks including prettier, markdownlint, and other checks

name: Format and Lint Check

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  format-and-lint-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install dependencies
        run: make install

      - name: Run pre-commit checks
        run: make lint

      - name: Check formatting (fallback)
        run: make format-check
