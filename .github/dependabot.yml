version: 2
updates:
  # Action pins in .github/workflows/. The jj release pinned in the "Install jj"
  # step is plain text in a run: block, so Dependabot does not see it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # pyproject.toml + uv.lock. Makefile's typecheck comment names the ty version
  # it was written against; recheck it when a ty bump lands.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
