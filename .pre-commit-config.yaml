repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.yaml"]
        exclude: ^cache/

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua
        files: ^dotfiles/nvim/

  - repo: local
    hooks:
      - id: luacheck
        name: luacheck
        entry: luacheck --config dotfiles/nvim/.config/nvim/.luacheckrc
        language: system
        types: [lua]
        files: ^dotfiles/nvim/
      - id: elisp-check
        name: elisp check (parens + byte-compile)
        entry: scripts/elisp-check.sh
        language: script
        files: '\.el$'
      - id: ruff
        name: ruff (lint Python)
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: skill-lint
        name: skill lint (frontmatter, links, known-bad snippets)
        entry: scripts/skill-lint.py
        language: script
        pass_filenames: false
        files: '^(skills|\.claude/skills|teej-skills/skills)/.*/SKILL\.md$|^rules/.*\.md$|^scripts/skill-lint\.py$'
