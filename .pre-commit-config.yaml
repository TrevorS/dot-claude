repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.yaml"]
        exclude: ^cache/

  # codespell, not aspell: aspell asks "is this in a dictionary", which on a repo
  # full of identifiers is all false positives. codespell flags only KNOWN
  # misspellings, so it is quiet enough to gate a commit. dotfiles/aspell handles
  # the other half — live underlining in the prompt.
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        # `[Cc]ontext` in a jq regex (hooks/status.sh) tokenizes to "ontext".
        args: ["--ignore-regex", '\[Cc\]ontext']
        # lscolors.sh: "*.caf"/"*.sav" are file extensions. baseline.json holds
        # deliberate typo fixtures for the spellcheck regression command.
        exclude: |
          (?x)^(
            dotfiles/lscolors/\.local/share/lscolors\.sh|
            skills/syncing-claude-config/baseline\.json
          )$

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua
        files: ^dotfiles/nvim/

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (lint shell)
        entry: shellcheck --severity=warning
        language: system
        types: [shell]
        # shellcheck has no zsh dialect, and lscolors.sh is a generated
        # LS_COLORS dump that is sourced rather than run, so it carries no
        # shebang for shellcheck to infer one from.
        exclude: '^dotfiles/(lscolors|zsh)/'
      - id: luacheck
        name: luacheck
        entry: luacheck --config dotfiles/nvim/.config/nvim/.luacheckrc
        language: system
        types: [lua]
        files: ^dotfiles/nvim/
      - id: elisp-check
        name: elisp check (parens + byte-compile)
        entry: scripts/elisp-check.sh
        language: script
        files: '\.el$'
      - id: ruff
        name: ruff (lint Python)
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: skill-lint
        name: skill lint (frontmatter, links, known-bad snippets)
        entry: scripts/skill-lint.py
        language: script
        pass_filenames: false
        files: '^(skills|\.claude/skills|teej-skills/skills)/.*/SKILL\.md$|^rules/.*\.md$|^scripts/skill-lint\.py$'
